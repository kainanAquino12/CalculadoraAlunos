<!doctype html>
<html lang="pt-BR" data-theme="light" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>NotaCerta</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="NotaCerta: saiba quanto falta para passar. Acompanhe suas notas e descubra a nota mínima das próximas avaliações." />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema antes da primeira pintura, para não piscar branco no modo escuro.
      (function () {
        try {
          var t = localStorage.getItem('notacerta:theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-bs-theme', t);
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0f1c');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
